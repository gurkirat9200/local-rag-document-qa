<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local RAG Studio</title>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--panel:rgba(15,28,48,.84);--line:#243b5a;--text:#e5eefc;--muted:#91a4be;--accent:#7c8cff;--good:#38d39f}
    *{box-sizing:border-box}body{margin:0;color:var(--text);font:14px system-ui,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0,#263c85 0,transparent 35%),var(--bg)}
    header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(8,17,31,.72);backdrop-filter:blur(16px);position:sticky;top:0;z-index:2}
    main{max-width:1280px;height:calc(100vh - 68px);margin:auto;padding:18px;display:grid;grid-template-columns:290px 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0003}.side{padding:18px;display:flex;flex-direction:column;min-height:0}
    h1,h2,p{margin:0}h1{font-size:18px}h2{font-size:15px}.brand{display:flex;gap:10px;align-items:center}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6674ff,#c14fff);font-size:20px}
    .muted{color:var(--muted);font-size:12px}.drop{margin-top:18px;border:1px dashed #52709c;border-radius:14px;padding:24px 12px;text-align:center;cursor:pointer}.drop:hover{border-color:var(--accent);background:#5264ff12}.drop input{display:none}
    .docs{overflow:auto;flex:1;margin-top:12px}.doc{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;background:#ffffff08;margin-bottom:6px}.doc button{border:0;background:transparent;color:#f98b9c;cursor:pointer}.chat{display:flex;flex-direction:column;min-height:0}.messages{overflow:auto;flex:1;padding:26px}.message{max-width:820px;padding:14px 16px;border-radius:16px;margin-bottom:14px;line-height:1.55;white-space:pre-wrap}.message pre{white-space:pre;overflow:auto;background:#081525;padding:10px;border-radius:8px}.message code{color:#b9c8ff}.user{margin-left:auto;background:#4654bc}.assistant{background:#162943;border:1px solid #284264}.sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:11px;color:#b9c8ff;border:1px solid #475a94;border-radius:99px;padding:4px 8px}.composer{display:flex;gap:8px;padding:16px;border-top:1px solid var(--line)}textarea{flex:1;min-height:44px;max-height:130px;resize:vertical;background:#081525;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}button.send{border:0;border-radius:12px;padding:0 18px;background:linear-gradient(135deg,#6674ff,#b84cff);color:#fff;font-weight:700;cursor:pointer}.status{display:flex;gap:12px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#697890}.up{background:var(--good)}.progress{height:5px;border-radius:5px;background:#23334d;margin-top:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.side{min-height:280px}.chat{height:70vh}}
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">✦</div><div><h1>Local RAG Studio</h1><p class="muted">Private document intelligence</p></div></div><div class="status"><span id="healthDot" class="dot"></span><span id="healthText" class="muted">Checking</span><span id="latency" class="muted">-- ms</span></div></header>
  <main><aside class="panel side"><h2>Knowledge base</h2><p class="muted">PDF, DOCX, XLSX, CSV, JSON, Markdown, code and text</p><label class="drop" id="drop">Drop files or click to upload<input id="file" type="file" multiple accept=".pdf,.docx,.xlsx,.csv,.json,.md,.py,.js,.ts,.txt"><div id="uploadStatus" class="muted"></div><div class="progress"><div id="bar" class="bar"></div></div></label><div style="display:flex;justify-content:space-between;margin-top:22px"><h2>Documents</h2><span id="count" class="muted">0</span></div><div id="docs" class="docs"></div></aside><section class="panel chat"><div id="messages" class="messages"><div id="welcome" style="text-align:center;margin:auto"><h2>Ask your documents anything</h2><p class="muted" style="margin-top:8px">Upload a file, then ask a grounded question.</p></div></div><form id="form" class="composer"><textarea id="question" placeholder="Ask a question..." maxlength="4000"></textarea><button class="send" type="submit">Send</button></form></section></main>
  <script>
    const $=id=>document.getElementById(id), esc=v=>{const n=document.createElement("span");n.textContent=v??"";return n.innerHTML};
    async function api(path,opts={}){const r=await fetch(path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Request failed");return d}
    function toast(text){$("uploadStatus").textContent=text;setTimeout(()=>{$("uploadStatus").textContent=""},3500)}
    async function refresh(){try{const [h,docs]=await Promise.all([api("/health"),api("/documents")]);$("healthDot").className="dot "+(h.status!=="unhealthy"?"up":"");$("healthText").textContent=h.status;$("count").textContent=docs.length;$("docs").innerHTML=docs.map(d=>`<div class="doc"><span title="${esc(d.source)}">📄 ${esc(d.source)}<small class="muted"> · ${d.chunk_count} chunks</small></span><button data-source="${encodeURIComponent(d.source)}">×</button></div>`).join("")||'<p class="muted">No documents yet</p>'}catch(e){$("healthText").textContent="Offline"}}
    $("docs").onclick=async e=>{if(e.target.dataset.source){await api("/documents/"+e.target.dataset.source,{method:"DELETE"});refresh()}};
    async function upload(file){const form=new FormData();form.append("file",file);$("uploadStatus").textContent=`Uploading ${file.name}`;$("bar").style.width="20%";try{const d=await api("/upload",{method:"POST",body:form});$("bar").style.width="100%";toast(`${d.filename}: ${d.chunks_processed} chunks indexed`);refresh()}catch(e){toast(e.message)}finally{setTimeout(()=>$("bar").style.width="0",700)}}
    $("file").onchange=e=>[...e.target.files].forEach(upload);$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=e=>{e.preventDefault();[...e.dataTransfer.files].forEach(upload)};
    function renderMarkdown(text){return esc(text).replace(/```[\w+-]*\n?([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/\n/g,"<br>")}
    function add(role,text,sources=[]){$("welcome")?.remove();const el=document.createElement("div");el.className=`message ${role}`;el.innerHTML=renderMarkdown(text);if(sources.length)el.innerHTML+=`<div class="sources">${sources.map(s=>`<span class="chip">${esc(s.source)} · ${(s.similarity*100).toFixed(1)}%</span>`).join("")}</div>`;$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight;return el}
    $("form").onsubmit=async e=>{e.preventDefault();const question=$("question").value.trim();if(!question)return;$("question").value="";add("user",question);const answer=add("assistant","");const started=performance.now();try{const r=await fetch("/query",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question})});if(!r.ok)throw Error("Query failed");const reader=r.body.getReader(),decoder=new TextDecoder();let buffer="",sources=[];while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split("\n");buffer=lines.pop();for(const line of lines)if(line.startsWith("data: ")){const event=JSON.parse(line.slice(6));if(event.type==="metadata"){sources=event.sources||[]}if(event.type==="token"){answer.childNodes[0].textContent+=(answer.childNodes[0].textContent?"":"")+event.token;$("messages").scrollTop=$("messages").scrollHeight}}}answer.innerHTML=renderMarkdown(answer.textContent);if(sources.length)answer.innerHTML+=`<div class="sources">${sources.map(s=>`<span class="chip">${esc(s.source)} · ${(s.similarity*100).toFixed(1)}%</span>`).join("")}</div>`;$("latency").textContent=`${Math.round(performance.now()-started)} ms`}catch(e){answer.textContent=e.message}};
    refresh();
  </script>
</body>
</html>
